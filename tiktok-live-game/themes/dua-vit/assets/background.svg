<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Nền tạm (vẽ tay): đua vịt trên sông quê. Trời + cây y 0–480, sông 8 làn y 520–1120 (vịt bơi từ trái sang phải), bờ cỏ cho khán giả từ y ~1170. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc4f0"/><stop offset="1" stop-color="#d8f3ff"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa6d8"/><stop offset="1" stop-color="#1d6fa3"/></linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c75a"/><stop offset="1" stop-color="#3c7a2b"/></linearGradient>
  </defs>
  <rect width="1080" height="520" fill="url(#sky)"/>
  <g fill="#fff" opacity=".9"><ellipse cx="200" cy="380" rx="100" ry="30"/><ellipse cx="270" cy="362" rx="70" ry="32"/><ellipse cx="850" cy="420" rx="110" ry="28"/><ellipse cx="790" cy="404" rx="64" ry="28"/></g>
  <!-- bờ xa: tre, mái nhà -->
  <path d="M0 520 V450 q30-50 60-8 q30-60 60-12 q30-40 70 0 q30-60 60-10 q40-40 80 0 q30-60 60-8 q40-50 80 0 q30-60 60-10 q30-40 70 0 q30-60 60-10 q40-50 80 0 q30-40 60 0 q30-60 60-10 q30-40 60 0 q30-50 60-8 V520Z" fill="#2f6b34"/>
  <path d="M640 470 l50-36 l50 36Z" fill="#b5532f"/><rect x="652" y="470" width="76" height="40" fill="#e8d3a6"/>
  <rect y="500" width="1080" height="26" fill="#7cb84e"/>
  <!-- sông, vạch chia làn -->
  <rect y="526" width="1080" height="600" fill="url(#water)"/>
  <g stroke="#ffffff" stroke-opacity=".28" stroke-width="3" stroke-dasharray="22 18">
    <path d="M0 597 H1080 M0 668 H1080 M0 740 H1080 M0 811 H1080 M0 882 H1080 M0 954 H1080 M0 1025 H1080"/>
  </g>
  <g fill="#ffffff" opacity=".18"><ellipse cx="300" cy="640" rx="60" ry="4"/><ellipse cx="700" cy="780" rx="80" ry="4"/><ellipse cx="420" cy="930" rx="70" ry="4"/><ellipse cx="860" cy="1060" rx="60" ry="4"/></g>
  <!-- phao hai đầu làn -->
  <g fill="#ff6b6b"><circle cx="130" cy="560" r="10"/><circle cx="130" cy="1090" r="10"/><circle cx="975" cy="560" r="10"/><circle cx="975" cy="1090" r="10"/></g>
  <!-- bờ gần cho khán giả -->
  <path d="M0 1120 Q540 1100 1080 1120 V1920 H0Z" fill="url(#bank)"/>
  <path d="M0 1126 Q540 1106 1080 1126" fill="none" stroke="#c9a46a" stroke-width="10"/>
  <g fill="#2f6b34" opacity=".35"><circle cx="120" cy="1500" r="40"/><circle cx="960" cy="1440" r="46"/><circle cx="520" cy="1820" r="60"/></g>
</svg>
