<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Nền tạm v2 (vẽ tay): ao dọc giữa khung, hai bờ cỏ trái phải cho người ngồi, cầu tre bắc ngang ở y ~1140.
       Mép ao khớp scene.json "aisle": nửa bề rộng 175px ở y 640, 235px ở y 1650. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2350"/><stop offset=".5" stop-color="#9a4a78"/>
      <stop offset=".85" stop-color="#ee8a5c"/><stop offset="1" stop-color="#ffcf8a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4cf"/><stop offset=".35" stop-color="#ffd68a"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a56c"/><stop offset=".18" stop-color="#b8708a"/>
      <stop offset=".55" stop-color="#525283"/><stop offset="1" stop-color="#26355a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d3e"/><stop offset=".45" stop-color="#486630"/><stop offset="1" stop-color="#1f3519"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a5e"/><stop offset="1" stop-color="#8a6236"/>
    </linearGradient>
  </defs>

  <!-- trời, mặt trời -->
  <rect width="1080" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="420" r="220" fill="url(#sun)" opacity=".75"/>
  <circle cx="680" cy="430" r="58" fill="#fff0c4"/>

  <!-- bờ cỏ cả khung (ao vẽ đè lên) -->
  <rect y="520" width="1080" height="1400" fill="url(#grass)"/>
  <!-- lũy tre, mái đình phía xa -->
  <path d="M0 600 V470 q30-50 60-10 q20-70 50-20 q25-40 55 0 q30-60 60-5 q20-30 45 5 L330 500 V600 Z" fill="#3b2a48"/>
  <path d="M750 600 V490 q40-40 70-8 q30-50 70-4 q40-34 80 0 q30-40 60-10 q30-20 50 0 V600 Z" fill="#3b2a48"/>
  <path d="M430 540 L470 505 h140 l40 35 Z" fill="#2c1f38"/>
  <path d="M410 545 q36-6 60-42 h140 q24 36 60 42 Z" fill="#45304f"/>
  <rect x="460" y="540" width="160" height="34" fill="#2c1f38"/>
  <path d="M0 600 q270-30 540-20 q270 10 540-6 V640 H0 Z" fill="#53713a"/>

  <!-- mặt ao dọc -->
  <path d="M370 560 Q540 520 710 560 L781 1760 Q540 1840 299 1760 Z" fill="url(#water)"/>
  <g fill="#ffe3a8" opacity=".5">
    <ellipse cx="640" cy="600" rx="70" ry="6"/><ellipse cx="636" cy="640" rx="56" ry="5"/>
    <ellipse cx="646" cy="690" rx="44" ry="4"/><ellipse cx="634" cy="750" rx="32" ry="4"/><ellipse cx="642" cy="820" rx="22" ry="3"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3">
    <path d="M420 900 q50-8 100 0 M580 980 q60-8 120 0 M400 1300 q70-10 140 0 M600 1380 q60-8 120 0 M420 1560 q80-10 160 0 M590 1650 q60-8 120 0"/>
  </g>
  <!-- bờ đất mép ao -->
  <g fill="none" stroke="#3b2a1c" stroke-opacity=".5" stroke-width="10">
    <path d="M370 560 L299 1760"/><path d="M710 560 L781 1760"/>
  </g>
  <!-- lá sen gần hai mép, phía dưới -->
  <g fill="#2f5a3c">
    <ellipse cx="360" cy="1420" rx="50" ry="16"/><ellipse cx="400" cy="1500" rx="40" ry="13"/>
    <ellipse cx="720" cy="1460" rx="54" ry="17"/><ellipse cx="690" cy="1560" rx="40" ry="13"/>
    <ellipse cx="420" cy="800" rx="34" ry="11"/><ellipse cx="660" cy="860" rx="30" ry="10"/>
  </g>
  <g fill="#f3a6c0"><circle cx="366" cy="1408" r="9"/><circle cx="726" cy="1446" r="9"/><circle cx="424" cy="790" r="7"/></g>

  <!-- cầu tre bắc ngang ao -->
  <rect x="270" y="1112" width="540" height="56" fill="url(#plank)"/>
  <g stroke="#6b4826" stroke-width="3" opacity=".7">
    <path d="M300 1112 v56 M340 1112 v56 M380 1112 v56 M420 1112 v56 M460 1112 v56 M500 1112 v56 M540 1112 v56 M580 1112 v56 M620 1112 v56 M660 1112 v56 M700 1112 v56 M740 1112 v56 M780 1112 v56"/>
  </g>
  <g fill="#5a3b1e">
    <rect x="270" y="1096" width="540" height="6"/>
    <rect x="300" y="1096" width="6" height="20"/><rect x="420" y="1096" width="6" height="20"/><rect x="540" y="1096" width="6" height="20"/>
    <rect x="660" y="1096" width="6" height="20"/><rect x="774" y="1096" width="6" height="20"/>
    <rect x="360" y="1168" width="8" height="40"/><rect x="540" y="1168" width="8" height="44"/><rect x="712" y="1168" width="8" height="40"/>
  </g>

  <!-- cỏ lau mép ao -->
  <g stroke="#7c9a4c" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M352 700 l-10-36 M346 760 l-14-30 M330 1000 l-12-34 M318 1250 l-14-32 M306 1600 l-12-36 M726 720 l10-36 M736 860 l14-30 M752 1040 l12-34 M764 1300 l14-32 M776 1620 l12-36"/>
  </g>
  <!-- hoa cỏ trang trí góc dưới (vùng khung bình luận TikTok, không đặt người) -->
  <g fill="#f6e39a" opacity=".8"><circle cx="90" cy="1400" r="5"/><circle cx="160" cy="1480" r="4"/><circle cx="120" cy="1580" r="5"/><circle cx="220" cy="1650" r="4"/><circle cx="60" cy="1700" r="4"/></g>
  <rect y="1760" width="1080" height="160" fill="#162812" opacity=".5"/>
</svg>
